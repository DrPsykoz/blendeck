<VirtualHost *:80>
    ServerName blendeck.fr

    # SSE support — no buffering for /api/
    ProxyPass /api/ http://127.0.0.1:8000/api/ retry=0
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Frontend
    ProxyPass / http://127.0.0.1:3000/ retry=0
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket support (Next.js dev/hot-reload — optional)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:3000/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/blendeck_error.log
    CustomLog ${APACHE_LOG_DIR}/blendeck_access.log combined
</VirtualHost>
