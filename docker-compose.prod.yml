services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/blendeck-backend:${IMAGE_TAG:-latest}
    container_name: dj-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - audio-cache:/app/cache
      # YouTube cookies (Netscape format) to bypass bot-detection on datacenter IPs.
      # Create $DEPLOY_PATH/cookies.txt on the server BEFORE deploy, or Docker
      # creates a directory at this path and yt-dlp will ignore it.
      - ./cookies.txt:/app/cache/cookies.txt:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/${GHCR_OWNER}/blendeck-frontend:${IMAGE_TAG:-latest}
    container_name: dj-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  audio-cache:
    name: blendeck_audio_cache
